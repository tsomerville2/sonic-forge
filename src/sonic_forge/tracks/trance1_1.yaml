# switch.angel live session — described in YAML
# Recreated second-by-second from her Tidal Cycles live coding streams.
# Each section = a moment where she changes the code live.
# The converter turns this into a WAV with timed voiceovers.
#
# Inspired by Switch.Angel — https://www.youtube.com/@Switch-Angel
# She opened our eyes to generative computer music and led us to Tidal Cycles.
# This whole project exists because of her. Go subscribe.

title: switch.angel session
bpm: 136
voice: Samantha                # Voice name — daniel, heart, alice, Samantha, Zarvox...
# engine: kokoro             # TTS engine — say (macOS), kokoro (neural, 54 voices)
# fx: helmet                 # Robot FX — helmet, intercom, droid, ringmod, bitcrush, vocoder
# music_volume: 0.8          # Music level 0.0-2.0 (try 0.6 for narrated songs)
# voice_volume: 0.5          # Voice level 0.0-2.0 (try 0.5 for gentle narration)
voice_lead: 2.0               # Seconds before each change to start speaking

sections:
  - say: "in the beginning, there were five notes"
    cycles: 7
    layers:
      - synth: pluck
        notes: g2 d3 g2 bb3 g3
        fast: 16

  - say: "now let's switch to sawtooth, with an acid envelope"
    cycles: 3
    layers:
      - synth: acid
        notes: g2 d3 g2 bb3 g3
        fast: 16

  - say: "here comes the kick drum, four on the floor"
    cycles: 3
    layers:
      - synth: acid
        notes: g2 d3 g2 bb3 g3
        fast: 16
      - mini: "bd*4"

  - say: "adding some sidechain ducking"
    cycles: 4
    layers:
      - synth: acid
        notes: g2 d3 g2 bb3 g3
        fast: 16
      - mini: "bd*4"

  - say: "and now, the bass enters, pulsing on the root"
    cycles: 10
    layers:
      - synth: acid
        notes: g2 d3 g2 bb3 g3
        fast: 16
      - mini: "bd*4"
      - synth: acid
        notes: g1
        fast: 16

  - say: "switching to supersaw, cranking the detune"
    cycles: 10
    layers:
      - synth: saw
        notes: g2 d3 g2 bb3 g3
        fast: 16
      - mini: "bd*4"
      - synth: saw
        notes: g1
        fast: 16

  - say: "a little cymbal wash on top"
    cycles: 10
    layers:
      - synth: saw
        notes: g2 d3 g2 bb3 g3
        fast: 16
      - mini: "bd*4"
      - synth: saw
        notes: g1
        fast: 16
      - mini: "oh*2"

  - say: "now we crank both sliders up, full power, let it ride"
    cycles: 20
    layers:
      - synth: acid
        notes: g2 d3 g2 bb3 g3
        fast: 16
      - synth: saw
        notes: g2 d3 g2 bb3 g3
        fast: 16
      - mini: "bd*4"
      - synth: saw
        notes: g1
        fast: 16
      - mini: "oh*2"
