[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sonic-forge"
version = "0.7.8"
description = "Bytebeat music DSL + multi-engine TTS + talking heads — beamed from starforge"
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
    "typer",
    "numpy",
    "soundfile",
    "kokoro-onnx",
    "onnxruntime",
]

[project.optional-dependencies]
llm = ["anthropic", "google-generativeai"]

[project.urls]
Inspiration = "https://www.youtube.com/@Switch-Angel"

[project.scripts]
sonic-forge = "sonic_forge.cli:app"

[tool.hatch.build]
include = ["src/sonic_forge/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/sonic_forge"]
