[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sonic-forge"
version = "0.10.1"
description = "Local speech, narration with frame-accurate timings for video, and music made from code: Kokoro, Edge and macOS voices, voice FX, bytebeat."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["tts", "text-to-speech", "narration", "voiceover", "kokoro", "edge-tts", "remotion", "timing", "bytebeat", "music", "cli", "agent-skills"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
]
dependencies = [
    "pyyaml",
    "typer",
    "rich",  # typer's formatted --help; without it every example is rewrapped into one paragraph
]

[project.optional-dependencies]
kokoro = ["kokoro-onnx", "onnxruntime", "soundfile", "numpy"]
tts = ["kokoro-onnx", "onnxruntime", "soundfile", "numpy", "f5-tts-mlx"]
robot = ["soundfile", "numpy"]
all = ["kokoro-onnx", "onnxruntime", "soundfile", "numpy", "f5-tts-mlx"]

[project.urls]
Homepage = "https://github.com/tsomerville2/sonic-forge"
Source = "https://github.com/tsomerville2/sonic-forge"

[project.scripts]
sonic-forge = "sonic_forge.cli:run"

[tool.hatch.build]
include = ["src/sonic_forge/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/sonic_forge"]
